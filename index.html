<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>HomeBudget</title>
<style>
  :root {
    --primary: #2563eb;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --error: #dc2626;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Roboto, Segoe UI, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 28px 22px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  h1 {
    font-size: 22px;
    text-align: center;
    margin: 0 0 4px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin: 14px 0 6px;
  }
  input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1.5px solid #e2e8f0;
    font-size: 16px;
  }
  input:focus { outline: none; border-color: var(--primary); }
  button {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    margin-top: 20px;
    cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-secondary { background: transparent; color: var(--primary); margin-top: 10px; }
  .msg {
    font-size: 14px;
    text-align: center;
    margin-top: 14px;
    min-height: 18px;
  }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--success); }
  .hidden { display: none; }
  .profile-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #f1f5f9;
    font-size: 15px;
  }
  .profile-row span:first-child { color: var(--muted); }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--primary); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700;
    margin: 0 auto 16px;
  }
  .loading { text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<div class="card">

  <div id="loadingView" class="hidden">
    <div class="loading">Loading HomeBudget…</div>
  </div>

  <div id="errorBanner" class="hidden" style="background:#fef2f2; border:1.5px solid #fecaca; color:#991b1b; padding:12px; border-radius:10px; font-size:13px; margin-bottom:16px;"></div>

  <!-- LOGIN VIEW -->
  <div id="loginView">
    <h1>🏠 HomeBudget</h1>
    <div class="subtitle">Log in to your household</div>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" />
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
    <button class="btn-primary" id="loginBtn">Log In</button>
    <button class="btn-secondary" id="showRegisterBtn">Don't have an account? Register</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- REGISTER VIEW -->
  <div id="registerView" class="hidden">
    <h1>🏠 HomeBudget</h1>
    <div class="subtitle">Create your account</div>
    <label>Your Name</label>
    <input type="text" id="regName" placeholder="e.g. Manoj" />
    <label>Email</label>
    <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" />
    <label>Password</label>
    <input type="password" id="regPassword" placeholder="At least 6 characters" autocomplete="new-password" />
    <button class="btn-primary" id="registerBtn">Create Account</button>
    <button class="btn-secondary" id="showLoginBtn">Already have an account? Log in</button>
    <div class="msg" id="registerMsg"></div>
  </div>

  <!-- PROFILE VIEW (shown after login) -->
  <div id="profileView" class="hidden">
    <div class="avatar" id="avatarInitial">M</div>
    <h1 id="profileName" style="text-align:center;">Name</h1>
    <div class="subtitle" style="text-align:center;" id="profileEmail">email@example.com</div>
    <div class="profile-row"><span>Preferred language</span><span>English</span></div>
    <div class="profile-row"><span>Currency</span><span>₹ INR</span></div>
    <button class="btn-primary" id="logoutBtn" style="background:#dc2626;">Log Out</button>
    <div class="msg" id="profileMsg"></div>
  </div>

</div>

<!-- Firebase SDKs: "compat" versions, loaded as plain scripts.
     This works when the file is opened directly on a phone, unlike
     the newer "module" style imports which browsers block for local files. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" crossorigin="anonymous" onerror="showLoadError()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" crossorigin="anonymous" onerror="showLoadError()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" crossorigin="anonymous" onerror="showLoadError()"></script>

<script>
  function showLoadError() {
    const banner = document.getElementById("errorBanner");
    banner.textContent = "Couldn't connect to the internet to load HomeBudget. Please check your WiFi/mobile data and reopen this page.";
    banner.classList.remove("hidden");
  }

  window.onerror = function (message) {
    const banner = document.getElementById("errorBanner");
    banner.textContent = "Something went wrong: " + message;
    banner.classList.remove("hidden");
    return false;
  };

  if (typeof firebase === "undefined") {
    showLoadError();
  }

  // Your Household project's connection details
  const firebaseConfig = {
    apiKey: "AIzaSyDcwU8BMWO66Uc5MDueLLOrunShPbn-W5g",
    authDomain: "household-d6f8e.firebaseapp.com",
    projectId: "household-d6f8e",
    storageBucket: "household-d6f8e.firebasestorage.app",
    messagingSenderId: "192128062770",
    appId: "1:192128062770:web:0ab46db15cb4a81001b32b"
  };

  let auth, db;
  try {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
  } catch (initErr) {
    const banner = document.getElementById("errorBanner");
    banner.textContent = "Setup error: " + (initErr && initErr.message ? initErr.message : initErr);
    banner.classList.remove("hidden");
  }

  const $ = (id) => document.getElementById(id);

  function showView(view) {
    ["loadingView", "loginView", "registerView", "profileView"].forEach(v => $(v).classList.add("hidden"));
    $(view).classList.remove("hidden");
  }

  $("showRegisterBtn").onclick = () => showView("registerView");
  $("showLoginBtn").onclick = () => showView("loginView");

  async function loadProfileAndShowProfile(user) {
    let data = { name: user.displayName || "User", email: user.email };
    try {
      const snap = await db.collection("Users").doc(user.uid).get();
      if (snap.exists) data = snap.data();
    } catch (readErr) {
      console.log("Could not read profile, using basic info:", readErr);
    }
    $("profileName").textContent = data.name;
    $("profileEmail").textContent = data.email;
    $("avatarInitial").textContent = (data.name || "U").charAt(0).toUpperCase();
    showView("profileView");
  }

  // ---- REGISTER ----
  $("registerBtn").onclick = async () => {
    const name = $("regName").value.trim();
    const email = $("regEmail").value.trim();
    const password = $("regPassword").value;
    const msg = $("registerMsg");
    msg.className = "msg";
    msg.textContent = "";

    if (!name || !email || !password) {
      alert("Please fill in all fields.");
      return;
    }
    if (password.length < 6) {
      alert("Password must be at least 6 characters.");
      return;
    }

    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await cred.user.updateProfile({ displayName: name });
      try {
        await db.collection("Users").doc(cred.user.uid).set({
          name, email, preferredLanguage: "english", currency: "INR", createdAt: new Date().toISOString()
        });
      } catch (dbErr) {
        console.log("Profile save issue:", dbErr);
      }
      alert("Account created successfully! Taking you to your profile now.");
      await loadProfileAndShowProfile(cred.user);
    } catch (err) {
      alert(friendlyError(err));
    }
  };

  // ---- LOGIN ----
  $("loginBtn").onclick = async () => {
    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;

    if (!email || !password) {
      alert("Please enter your email and password.");
      return;
    }

    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      await loadProfileAndShowProfile(cred.user);
    } catch (err) {
      alert(friendlyError(err));
    }
  };

  // ---- LOGOUT ----
  $("logoutBtn").onclick = async () => {
    try {
      await auth.signOut();
      alert("Logged out.");
    } catch (err) {
      alert("Could not log out: " + (err.message || err));
    }
  };

  // ---- Watch login state and show the right screen ----
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      await loadProfileAndShowProfile(user);
    } else {
      showView("loginView");
    }
  });

  function friendlyError(err) {
    const code = err.code || "";
    if (code.includes("email-already-in-use")) return "An account with this email already exists.";
    if (code.includes("invalid-email")) return "That doesn't look like a valid email address.";
    if (code.includes("weak-password")) return "Password must be at least 6 characters.";
    if (code.includes("user-not-found") || code.includes("wrong-password") || code.includes("invalid-credential"))
      return "Incorrect email or password.";
    if (code.includes("network-request-failed")) return "No internet connection. Please check your network.";
    return "Something went wrong. Please try again. (" + code + ")";
  }
</script>
</body>
</html>
